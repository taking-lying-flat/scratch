<!doctype html>
<html lang="zh-CN" data-color-mode="auto" data-light-theme="light_tritanopia" data-dark-theme="dark_tritanopia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{TYPE}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta name="twitter:card" content="summary">
  <title>{{TITLE}}</title>
  <link rel="canonical" href="{{URL}}">
  <link rel="icon" href="{{ROOT}}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ROOT}}assets/fonts/index.css">
  <link rel="stylesheet" href="{{ROOT}}assets/github-light-tritanopia.css">
  <link rel="stylesheet" href="{{ROOT}}assets/github-dark-tritanopia.css">
  <link rel="stylesheet" href="{{ROOT}}assets/math.css">
  <link rel="stylesheet" href="{{ROOT}}assets/reader.css">
  <script src="{{ROOT}}assets/theme.js"></script>
  <script src="{{ROOT}}assets/reader.js" defer></script>
</head>
<body id="top" class="{{PAGE_CLASS}}-shell">
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <div class="logo">
        <a href="{{ROOT}}">Blog</a>
        <button class="theme-toggle" type="button" aria-label="切换配色" title="切换配色" hidden>
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2a9 9 0 1 0 9.9 9.9Z"/></svg>
          <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <ul class="menu">
        <li><a href="{{ROOT}}"{{POSTS_CURRENT}}>文章</a></li>
        <li><a href="{{ROOT}}archives/"{{ARCHIVES_CURRENT}}>归档</a></li>
        <li><a href="https://github.com/taking-lying-flat/blog">GitHub <span aria-hidden="true">↗</span></a></li>
      </ul>
    </nav>
  </header>
  <main class="main {{PAGE_CLASS}}" id="main">{{BODY}}</main>
  <footer class="site-footer">
    <img class="footer-art" src="{{ROOT}}assets/anime-readers.png" width="2172" height="724" alt="" aria-hidden="true" loading="lazy" decoding="async">
    <span>© 2026 <a href="{{ROOT}}">Blog</a></span>
    <span>托管于 <a href="https://github.com/taking-lying-flat/blog">GitHub Pages</a></span>
  </footer>
  <p class="sr-only" id="copy-status" role="status" aria-live="polite"></p>
</body>
</html>
